[project]
name = "oud-tpbm"
version = "1.0.0.dev0"
description = "Analysis code for an fNIRS case series of executive function in opioid use disorder with transcranial photobiomodulation: assessment and task scoring, GLM, hypothesis tests, longitudinal analysis and figures"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Yibei Chen"},
    {name = "Anayali Estudillo-Guerra", email = "aestudillo@hopehouse.org"},
    {name = "Ine Mesia"},
    {name = "Paolo Cassano"},
]
dependencies = [
    # Numerical core
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "natsort>=8.4",
    # Environment + I/O
    "python-dotenv>=1.0",
    # Memory logging in the first-level GLM scripts
    "psutil>=5.9",
    # Neuroimaging helpers and atlas tools (needed by scripts/hypo_test
    # and other downstream analyses)
    "nilearn>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
brain = [
    # Heavy, only needed for the stages that read raw SNIRF.
    "mne-nirs>=0.6",
    # Read directly by scripts/brain/channel_names.py.
    "h5py>=3.8",
]
bayes = [
    # Optional Bayesian comparators used by scripts/hypo_test/utils/
    "pymc>=5.0",
    "arviz>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "tests*"]
